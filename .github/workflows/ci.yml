name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build compiler image (JFlex + CUP + javac)
        run: docker build -t pp1-mjc .

      - name: Compile and run the test programs on the MicroJava VM
        run: ./run.sh test

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: test-logs/
